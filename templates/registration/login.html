<!DOCTYPE html>
<html lang="ar" dir="rtl">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - ميزان العدالة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #667eea;
            font-size: 28px;
        }
        .password-input-group {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6c757d;
            z-index: 10;
        }
        .password-toggle:hover {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <img src="{% static 'images/logo.jpg' %}" alt="Logo" style="width: 120px; margin-bottom: 15px;">
            <h1 style="color: #4f46e5; font-weight: 700;">ميزان العدالة</h1>
            <p class="text-muted">نظام إدارة مكاتب المحاماة</p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            
            {% if form.errors %}
            <div class="alert alert-danger">
                <i class="fas fa-exclamation-triangle"></i>
                اسم المستخدم أو كلمة المرور غير صحيحة
            </div>
            {% endif %}
            
            {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
            {% endif %}
            
            <div class="mb-3">
                <label for="id_username" class="form-label">
                    <i class="fas fa-user"></i> اسم المستخدم
                </label>
                <input type="text" class="form-control" id="id_username" name="username" required autofocus placeholder="أدخل اسم المستخدم">
            </div>
            
            <div class="mb-3">
                <label for="id_password" class="form-label">
                    <i class="fas fa-lock"></i> كلمة المرور
                </label>
                <div class="password-input-group">
                    <input type="password" class="form-control" id="id_password" name="password" required placeholder="أدخل كلمة المرور">
                    <i class="fas fa-eye password-toggle" id="togglePassword" title="إظهار كلمة المرور"></i>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary w-100">
                <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
            </button>
        </form>
    </div>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('id_password');
        
        togglePassword.addEventListener('click', function () {
            // تبديل نوع الحقل
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // تبديل الأيقونة
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
